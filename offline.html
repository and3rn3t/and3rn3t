<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbf8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d0b" />
    <title>Offline | Matthew Anderson</title>
    <!--
      Self-contained on purpose: the service worker shows this page when the network is down, so
      it can't count on any other file being cached. The colours are the design tokens in
      styles/core.css (same values, same light-dark() resolution), copied here.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --surface: light-dark(#fbfbf8, #0b0d0b);
        --surface-raised: light-dark(#ffffff, #131613);
        --text: light-dark(#15181a, #eef1ee);
        --muted: light-dark(#4a524d, #a4aba6);
        --border: light-dark(#dcdfd7, #252a25);
        --border-strong: light-dark(#b9beb4, #3a403a);
        --accent: light-dark(#15803d, #4ade80);
        --accent-contrast: light-dark(#ffffff, #052e16);
      }

      :root[data-theme='light'] {
        color-scheme: light;
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
        background: var(--surface);
        color: var(--text);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        line-height: 1.6;
      }

      main {
        width: min(100%, 34rem);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: var(--muted);
        font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.75rem, 1.2rem + 2vw, 2.75rem);
        letter-spacing: -0.02em;
        line-height: 1.2;
        text-wrap: balance;
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 1.125rem;
        text-wrap: pretty;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 2rem;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0.5rem 1.25rem;
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }

      .button:hover {
        border-color: var(--text);
      }

      .button--primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-contrast);
      }

      .button--primary:hover {
        border-color: var(--accent);
        filter: brightness(1.08);
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .status {
        margin: 0;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 0.875rem;
      }

      .status::before {
        content: '';
        display: inline-block;
        width: 0.5rem;
        height: 0.5rem;
        margin-right: 0.5rem;
        border-radius: 50%;
        background: var(--muted);
      }

      .status[data-online='true']::before {
        background: var(--accent);
      }
    </style>
    <script>
      // The saved theme, before first paint (same as every other page)
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <main>
      <p class="eyebrow">Offline</p>
      <h1>You're offline right now.</h1>
      <p>
        This page couldn't be loaded because there's no connection. If you've visited before, the
        home page and the projects you opened are saved on this device. Otherwise, try again once
        you're back online.
      </p>

      <div class="actions">
        <button type="button" class="button button--primary" id="retry">Try again</button>
        <a class="button" href="/">Go to the home page</a>
      </div>

      <p class="status" id="status" role="status" data-online="false">No connection</p>
    </main>

    <script>
      const status = document.getElementById('status');

      function show() {
        const online = navigator.onLine;
        status.dataset.online = String(online);
        // Online here means the browser has a connection, not that the site is reachable, so
        // don't promise a reload that nothing has scheduled
        status.textContent = online ? 'Connected, but the site did not load' : 'No connection';
      }

      document.getElementById('retry').addEventListener('click', () => location.reload());

      // Reload when the connection comes back. Only on that change: a reload on every check
      // would loop forever when the browser says it is online but the site is unreachable.
      window.addEventListener('online', () => {
        show();
        status.textContent = 'Back online, reloading…';
        setTimeout(() => location.reload(), 1000);
      });
      window.addEventListener('offline', show);
      show();
    </script>
  </body>
</html>
