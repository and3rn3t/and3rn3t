name = "and3rn3t-portfolio"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# The Worker answers on the site's own origin, andernet.dev/api/*, so the page calls it
# same-origin. A route only runs the Worker for matching paths; every other request still
# goes to GitHub Pages. workers_dev stays on: visitors with an older cached copy of the
# site still call the workers.dev address, and local tools use it.
workers_dev = true
routes = [
  { pattern = "andernet.dev/api/*", zone_name = "andernet.dev" },
  # The MCP server, and the documents agents use to find it and the API. Each is an exact path
  # or a narrow prefix, so the rest of /.well-known/ (security.txt, which Cloudflare manages)
  # still goes where it did.
  { pattern = "andernet.dev/mcp", zone_name = "andernet.dev" },
  { pattern = "andernet.dev/.well-known/api-catalog", zone_name = "andernet.dev" },
  { pattern = "andernet.dev/.well-known/ai-catalog.json", zone_name = "andernet.dev" },
  { pattern = "andernet.dev/.well-known/mcp/*", zone_name = "andernet.dev" },
  { pattern = "andernet.dev/.well-known/agent-skills/*", zone_name = "andernet.dev" },
]

[observability]
enabled = true

# Workers Rate Limiting (approximate, counted per Cloudflare location). The namespace ids are
# arbitrary integers that only have to be unique on the account; bindings that share one
# share counters.
[[ratelimits]]
name = "MCP_LIMITER"
namespace_id = "11301"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "GUESTBOOK_LIMITER"
namespace_id = "11302"
  [ratelimits.simple]
  limit = 10
  period = 60

# KV namespaces — create with:
#   wrangler kv namespace create VIEWS_KV
#   wrangler kv namespace create GUESTBOOK_KV
# Then paste the returned IDs below.
[[kv_namespaces]]
binding = "VIEWS_KV"
id      = "a35cba6980164bfea60443492b852a8a"

[[kv_namespaces]]
binding = "GUESTBOOK_KV"
id      = "470f1e368c014affaac0b2bab91a3f8f"

# Secrets set via wrangler secret put:
#   wrangler secret put GH_TOKEN          (fine-grained PAT, read:user scope)
#   wrangler secret put TURNSTILE_SECRET  (from dash.cloudflare.com → Turnstile)
# Local only: ALLOW_UNVERIFIED_GUESTBOOK=1 in a gitignored .dev.vars (see AGENTS.md).
