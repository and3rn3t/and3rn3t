name = "and3rn3t-portfolio"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# The Worker answers on the site's own origin, andernet.dev/api/*, so the page calls it
# same-origin. A route only runs the Worker for matching paths; every other request still
# goes to GitHub Pages. workers_dev stays on: visitors with an older cached copy of the
# site still call the workers.dev address, and local tools use it.
workers_dev = true
routes = [
  { pattern = "andernet.dev/api/*", zone_name = "andernet.dev" },
]

[observability]
enabled = true

# KV namespaces — create with:
#   wrangler kv namespace create VIEWS_KV
#   wrangler kv namespace create GUESTBOOK_KV
# Then paste the returned IDs below.
[[kv_namespaces]]
binding = "VIEWS_KV"
id      = "a35cba6980164bfea60443492b852a8a"

[[kv_namespaces]]
binding = "GUESTBOOK_KV"
id      = "470f1e368c014affaac0b2bab91a3f8f"

# Secrets set via wrangler secret put:
#   wrangler secret put GH_TOKEN          (fine-grained PAT, read:user scope)
#   wrangler secret put TURNSTILE_SECRET  (from dash.cloudflare.com → Turnstile)
# Local only: ALLOW_UNVERIFIED_GUESTBOOK=1 in a gitignored .dev.vars (see AGENTS.md).
