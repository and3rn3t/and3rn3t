# Applied by .github/workflows/labeler.yml on every PR.
# Globs match this repo's layout: modules/, styles/, worker/, tests/.

documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', 'docs/**']

ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**']

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          ['package.json', 'pnpm-lock.yaml', 'package-lock.json', 'pyproject.toml', 'renovate.json']

frontend:
  - changed-files:
      - any-glob-to-any-file: ['modules/**', 'main.js', 'styles/**', '*.html']

backend:
  - changed-files:
      - any-glob-to-any-file: ['worker/**', 'wrangler.toml']

tests:
  - changed-files:
      - any-glob-to-any-file: ['tests/**', '**/*.test.*', '**/*.spec.*']
