# Daily uptime + broken-link check for the live site. See
# reusable-site-check.yml in and3rn3t/.github for the shared jobs.
name: Site Check

on:
  schedule:
    - cron: '20 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-check:
    uses: and3rn3t/.github/.github/workflows/reusable-site-check.yml@99fae926f05867cc98ec7007b9fce8c1fd125b53 # v1
    with:
      url: https://andernet.dev

  # Report only: never fails. The scanner's checklist changes on its own, and five of its checks
  # (OAuth, auth.md, A2A, DNS-AID) do not apply to a portfolio.
  agent-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/check-agent-ready.mjs
          persist-credentials: false
      - run: node scripts/check-agent-ready.mjs https://andernet.dev

  # A gate, unlike the report above: it fails, and so alerts, when the uptime probe has stopped or its
  # last check failed. Cloudflare Monitors cannot do this, because a query that returns no rows gives
  # them nothing to evaluate. The probe is the cron trigger in wrangler.toml (worker/probe.js).
  uptime-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/check-probe.mjs
          persist-credentials: false
      - run: node scripts/check-probe.mjs https://andernet.dev

  # Opens an issue once each dated decision is due (CSP enforcement from 2026-11-27, the crawler
  # comparison from 2026-12-09), with the live numbers in it. Closing the issue means done.
  follow-ups:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/follow-ups.mjs
          persist-credentials: false
      - run: node scripts/follow-ups.mjs https://andernet.dev --create
