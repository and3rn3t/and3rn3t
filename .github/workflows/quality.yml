name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, unit tests, refs, generated files
    uses: and3rn3t/.github/.github/workflows/reusable-node-verify.yml@99fae926f05867cc98ec7007b9fce8c1fd125b53 # v1
    with:
      # One install for all the fast checks. `git add -N` makes brand-new generated files
      # visible to `git diff`, which otherwise ignores untracked files.
      command: >-
        pnpm validate &&
        pnpm generate:site && git add -N posts projects feed.xml sitemap.xml index.html 404.html images &&
        git diff --exit-code -- posts projects feed.xml sitemap.xml index.html 404.html images
      package-manager: pnpm

  e2e:
    name: E2E + a11y (Playwright + axe)
    uses: and3rn3t/.github/.github/workflows/reusable-playwright-e2e.yml@1c3373749e2b150f32a971f7b20f98d198133da0 # and3rn3t/.github#22 (not yet in tag v1)
    with:
      command: pnpm test:e2e
      package-manager: pnpm
