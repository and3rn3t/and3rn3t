name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, unit tests, refs, generated files
    uses: and3rn3t/.github/.github/workflows/reusable-node-verify.yml@0415d76d5dfdf1dec81d4756d411850057f38618 # v1
    with:
      # One install for all the fast checks. `git add -N` makes brand-new generated files
      # visible to `git diff`, which otherwise ignores untracked files.
      command: >-
        pnpm validate &&
        pnpm generate:posts && git add -N posts feed.xml sitemap.xml &&
        git diff --exit-code -- posts feed.xml sitemap.xml
      package-manager: pnpm

  e2e:
    name: E2E + a11y (Playwright + axe)
    uses: and3rn3t/.github/.github/workflows/reusable-playwright-e2e.yml@0415d76d5dfdf1dec81d4756d411850057f38618 # v1
    with:
      command: pnpm test:e2e
      package-manager: pnpm
