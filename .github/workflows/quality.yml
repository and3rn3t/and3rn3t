name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    uses: and3rn3t/.github/.github/workflows/reusable-node-verify.yml@bac71674cf57c550774f71a70e32a5bb7bec48ad # v1
    with:
      command: pnpm lint && pnpm format:check
      package-manager: pnpm

  generated:
    name: Generated files are up to date
    uses: and3rn3t/.github/.github/workflows/reusable-node-verify.yml@bac71674cf57c550774f71a70e32a5bb7bec48ad # v1
    with:
      # `git add -N` makes brand-new generated files visible to `git diff`, which otherwise ignores untracked files
      command: pnpm generate:posts && git add -N posts feed.xml sitemap.xml && git diff --exit-code -- posts feed.xml sitemap.xml
      package-manager: pnpm

  unit:
    name: Unit tests (Vitest)
    uses: and3rn3t/.github/.github/workflows/reusable-node-verify.yml@bac71674cf57c550774f71a70e32a5bb7bec48ad # v1
    with:
      command: pnpm test:unit
      package-manager: pnpm

  e2e:
    name: E2E + a11y (Playwright + axe)
    uses: and3rn3t/.github/.github/workflows/reusable-playwright-e2e.yml@bac71674cf57c550774f71a70e32a5bb7bec48ad # v1
    with:
      command: pnpm test:e2e
      package-manager: pnpm
