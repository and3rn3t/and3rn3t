# Consistency guard — fails a PR when baseline config files drift from
# ai-template-repo. Intentional drift goes in .consistency-ignore.
name: Consistency

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    uses: and3rn3t/.github/.github/workflows/reusable-consistency-guard.yml@bee3d0a11a39b66867b89dddc0306362587aa011 # v1
    with:
      mode: fail
