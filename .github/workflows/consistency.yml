# Consistency guard — fails a PR when baseline config files drift from
# ai-template-repo. Intentional drift goes in .consistency-ignore.
name: Consistency

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    uses: and3rn3t/.github/.github/workflows/reusable-consistency-guard.yml@99fae926f05867cc98ec7007b9fce8c1fd125b53 # v1
    with:
      mode: fail
