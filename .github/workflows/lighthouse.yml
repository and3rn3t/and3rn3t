name: Lighthouse CI

on:
  # Audits after each push-triggered deploy run from pages.yml, so they see the new build.
  # Allow manual runs with an optional URL override.
  workflow_dispatch:
    inputs:
      url:
        description: URL to audit (defaults to https://andernet.dev)
        required: false
        default: 'https://andernet.dev'
  # Weekly scheduled audit to catch drift.
  schedule:
    - cron: '0 8 * * 1' # Mondays at 08:00 UTC

jobs:
  lighthouse:
    uses: and3rn3t/.github/.github/workflows/reusable-lighthouse.yml@0415d76d5dfdf1dec81d4756d411850057f38618 # v1
    with:
      url: ${{ github.event.inputs.url || 'https://andernet.dev' }}
      config-path: .lighthouserc.cjs
