name: Lighthouse CI

on:
  # This workflow runs only on the weekly schedule and by hand, against the live site. The audits
  # that follow each deploy are separate jobs in pages.yml, not runs of this workflow.
  # Manual runs accept an optional URL override.
  workflow_dispatch:
    inputs:
      url:
        description: URL to audit (defaults to https://andernet.dev)
        required: false
        default: 'https://andernet.dev'
  # Weekly scheduled audit to catch drift.
  schedule:
    - cron: '0 8 * * 1' # Mondays at 08:00 UTC

permissions:
  contents: read

jobs:
  lighthouse:
    uses: and3rn3t/.github/.github/workflows/reusable-lighthouse.yml@99fae926f05867cc98ec7007b9fce8c1fd125b53 # v1
    with:
      url: ${{ github.event.inputs.url || 'https://andernet.dev' }}
      config-path: .lighthouserc.cjs

  # The phone: Lighthouse's default mobile emulation, which is the harder test
  lighthouse-mobile:
    uses: and3rn3t/.github/.github/workflows/reusable-lighthouse.yml@99fae926f05867cc98ec7007b9fce8c1fd125b53 # v1
    with:
      url: ${{ github.event.inputs.url || 'https://andernet.dev' }}
      config-path: .lighthouserc.mobile.cjs
