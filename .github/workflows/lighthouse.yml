name: Lighthouse CI

on:
  # Run once a push-triggered Pages deploy has finished, so the audit sees the new build.
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
  # Allow manual runs with an optional URL override.
  workflow_dispatch:
    inputs:
      url:
        description: URL to audit (defaults to https://andernet.dev)
        required: false
        default: 'https://andernet.dev'
  # Weekly scheduled audit to catch drift.
  schedule:
    - cron: '0 8 * * 1' # Mondays at 08:00 UTC

jobs:
  lighthouse:
    # Skip failed deploys and the daily data-refresh deploys (dispatched by the bot).
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    uses: and3rn3t/.github/.github/workflows/reusable-lighthouse.yml@bac71674cf57c550774f71a70e32a5bb7bec48ad # v1
    with:
      url: ${{ github.event.inputs.url || 'https://andernet.dev' }}
      config-path: .lighthouserc.cjs
