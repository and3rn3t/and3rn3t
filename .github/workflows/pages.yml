name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/update-github-data.yml'
      - 'README.md'
      - 'LICENSE'
      - 'renovate.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Explicit allowlist of what the site serves. Patterns are anchored with a
          # leading `/` so they can't match config, tests or Worker source in subfolders.
          sparse-checkout: |
            /*.html
            /styles.css
            /main.js
            /sw.js
            /manifest.json
            /favicon.svg
            /robots.txt
            /sitemap.xml
            /feed.xml
            /resume.pdf
            /CNAME
            /experience-data.json
            /github-data.json
            /posts-data.json
            /projects-data.json
            /fonts/
            /icons/
            /modules/
            /og/
            /posts/
          sparse-checkout-cone-mode: false

      - name: Check published files
        run: |
          missing=0
          for f in index.html 404.html offline.html styles.css main.js sw.js manifest.json \
                   favicon.svg og/default.png icons/sprite.svg fonts/inter-variable.woff2 CNAME; do
            [ -e "$f" ] || { echo "::error::missing from deploy: $f"; missing=1; }
          done
          leaked=$(find . -path ./.git -prune -o -type f \( -name 'package.json' -o -name '*.config.*' \
                   -o -path './tests/*' -o -path './worker/*' -o -path './scripts/*' \) -print)
          [ -z "$leaked" ] || { echo "::error::should not be published:"; echo "$leaked"; missing=1; }
          exit $missing

      - name: Stamp service worker build id
        run: sed -i "s/__BUILD_SHA__/${GITHUB_SHA::12}/" sw.js

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
