name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/update-github-data.yml'
      - 'README.md'
      - 'LICENSE'
      - 'renovate.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Explicit allowlist of what the site serves. Patterns are anchored with a
          # leading `/` so they can't match config, tests or Worker source in subfolders.
          sparse-checkout: |
            /*.html
            /main.js
            /sw.js
            /manifest.json
            /favicon.svg
            /robots.txt
            /sitemap.xml
            /feed.xml
            /llms.txt
            /resume.pdf
            /CNAME
            /experience-data.json
            /github-data.json
            /posts-data.json
            /projects-data.json
            /fonts/
            /icons/
            /images/
            /styles/
            /modules/
            /og/
            /posts/
            /projects/
          sparse-checkout-cone-mode: false

      - name: Check published files
        run: |
          missing=0
          for f in index.html 404.html offline.html main.js sw.js manifest.json \
                   favicon.svg og/default.png icons/sprite.svg fonts/inter-variable.woff2 CNAME; do
            [ -e "$f" ] || { echo "::error::missing from deploy: $f"; missing=1; }
          done
          leaked=$(find . -path ./.git -prune -o -type f \( -name 'package.json' -o -name '*.config.*' \
                   -o -path './tests/*' -o -path './worker/*' -o -path './scripts/*' \) -print)
          [ -z "$leaked" ] || { echo "::error::should not be published:"; echo "$leaked"; missing=1; }
          exit $missing

      # The id names the service worker's caches and changes the worker file, which makes
      # every visitor's browser re-download everything. So hash what the worker caches
      # (code, styles, pages, fonts, icons, images: the worker serves those cache-first, so a
      # changed one must change the id) and not the commit SHA: the daily data-only
      # deploys (*.json, og/, posts/, feed.xml) then keep the same worker and caches.
      - name: Stamp service worker build id
        run: |
          BUILD_ID=$(find . -path ./.git -prune -o -type f \
              \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.wasm' \
                 -o -path './fonts/*' -o -path './icons/*' -o -path './images/*' \) \
              ! -path './posts/*' ! -path './og/*' -print \
            | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -c1-12)
          echo "service worker build id: $BUILD_ID"
          sed -i "s/__BUILD_SHA__/$BUILD_ID/" sw.js

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # Cloudflare keeps the site at the edge for an hour (scripts/zone-cache.mjs), so every deploy,
  # the daily data refresh included, purges this host's copies. By hostname, never "everything":
  # the zone carries about twenty other apps. The second purge is a safety net: GitHub's own
  # CDN can hand out the previous copy for a moment after a deploy, and Cloudflare would then
  # keep that one. A separate job, so a failed purge is visible without undoing the deploy.
  purge-cache:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Purge andernet.dev from the Cloudflare cache
        env:
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          ZONE_ID: e2972feea910b8cfc6537b3f3f07ff5c
        run: |
          if [ -z "$CLOUDFLARE_PURGE_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_PURGE_TOKEN is not set, so the Cloudflare cache was not purged"
            exit 0
          fi
          purge() {
            for _ in 1 2 3; do
              if curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
                   -H "Authorization: Bearer $CLOUDFLARE_PURGE_TOKEN" \
                   -H 'Content-Type: application/json' \
                   --data '{"hosts":["andernet.dev"]}' | grep -q '"success":true'; then
                echo "purged andernet.dev"
                return 0
              fi
              sleep 5
            done
            echo "::error::could not purge the Cloudflare cache for andernet.dev"
            return 1
          }
          purge
          sleep 60
          purge

  # Audit the live site once the new build is up. Push deploys only: the daily
  # data-refresh dispatch changes JSON, not anything Lighthouse scores.
  lighthouse:
    if: github.event_name == 'push' && !cancelled() && needs.deploy.result == 'success'
    needs: [deploy, purge-cache]
    permissions:
      contents: read
    uses: and3rn3t/.github/.github/workflows/reusable-lighthouse.yml@99fae926f05867cc98ec7007b9fce8c1fd125b53 # v1
    with:
      url: https://andernet.dev
      config-path: .lighthouserc.cjs

  lighthouse-mobile:
    if: github.event_name == 'push' && !cancelled() && needs.deploy.result == 'success'
    needs: [deploy, purge-cache]
    permissions:
      contents: read
    uses: and3rn3t/.github/.github/workflows/reusable-lighthouse.yml@99fae926f05867cc98ec7007b9fce8c1fd125b53 # v1
    with:
      url: https://andernet.dev
      config-path: .lighthouserc.mobile.cjs
