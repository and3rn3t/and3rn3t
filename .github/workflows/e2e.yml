name: E2E

# Runs the browser tests only when something they can see has changed: the published site, the
# specs and their config, the dependencies, and the few non-site files the specs load (the list is
# `E2E_PATTERNS` in the `changes` job). They mock the whole Worker (tests/e2e/fixtures.js), so a
# change under worker/ cannot alter a result, except the files csp-report.spec.js imports:
# worker/csp-report.js and, through it, worker/telemetry.js.
# tests/unit/pages-workflow.test.js keeps that list in step with pages.yml's publish allowlist and
# with everything the specs import, directly or transitively.
#
# The workflow itself starts on every pull request, so it always reports a status. The path
# filter lives inside it: `E2E result` is green when the tests passed or had nothing to test,
# and red when they failed, which is what makes it safe to require on `main`. Do not require the
# `E2E + a11y` shard jobs: a skipped one reports nothing.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Do the browser tests apply
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          # Globs, one per line. `*.ext` matches at the repository root only, `dir/**` anything under it.
          E2E_PATTERNS: |
            *.html
            main.js
            sw.js
            manifest.json
            favicon.svg
            robots.txt
            sitemap.xml
            feed.xml
            llms.txt
            resume.pdf
            CNAME
            experience-data.json
            github-data.json
            posts-data.json
            projects-data.json
            fonts/**
            icons/**
            images/**
            styles/**
            modules/**
            og/**
            posts/**
            projects/**
            status/**
            tests/e2e/**
            scripts/zone-headers.mjs
            worker/csp-report.js
            worker/mcp-app-status.js
            worker/mcp-app-view.js
            worker/telemetry.js
            playwright.config.js
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .nvmrc
            .github/workflows/e2e.yml
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          matches() {
            local file=$1 glob
            while IFS= read -r glob; do
              [ -n "$glob" ] || continue
              # shellcheck disable=SC2053 # matching the glob is the point
              case "$glob" in
                '*.'*) [[ $file != */* && $file == $glob ]] && return 0 ;;
                *'/**') [[ $file == "${glob%\*\*}"* ]] && return 0 ;;
                *) [ "$file" = "$glob" ] && return 0 ;;
              esac
            done <<< "$E2E_PATTERNS"
            return 1
          }
          run=false
          while IFS= read -r file; do
            if matches "$file"; then
              echo "E2E applies: $file"
              run=true
              break
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          [ "$run" = true ] || echo "no changed file can affect the browser tests"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  e2e:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: E2E + a11y (Playwright + axe), shard ${{ matrix.shard }}/2
    # Two runners: the 292 specs take about 2 minutes on one, about 1 on each of two.
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2']
    uses: and3rn3t/.github/.github/workflows/reusable-playwright-e2e.yml@bee3d0a11a39b66867b89dddc0306362587aa011 # v1
    with:
      command: pnpm test:e2e --shard=${{ matrix.shard }}/2
      package-manager: pnpm
      shard: ${{ matrix.shard }}

  # The one check to require on `main`. It runs whatever happened before it, so a skipped or
  # cancelled shard cannot leave it unreported.
  result:
    name: E2E result
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "changes: $CHANGES, e2e: $E2E"
          [ "$CHANGES" = success ] && { [ "$E2E" = success ] || [ "$E2E" = skipped ]; }
