name: Update GitHub Data

on:
  schedule:
    # Run daily at 3 AM UTC (off-peak hours)
    - cron: '0 3 * * *'
  workflow_dispatch:

# Queue, never cancel: a run cancelled between `git push` and `gh pr merge` would leave
# the automation branch half-published.
concurrency:
  group: update-github-data
  cancel-in-progress: false

jobs:
  update-github-data:
    runs-on: ubuntu-latest
    # A hung API call or Chromium install must fail the run, not hold it for the 6 h default.
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Not the triggering SHA: a run queued behind another one (see `concurrency`) would
          # otherwise start from the commit before that run's merge and conflict with it.
          ref: main

      - name: Fetch GitHub Data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-github-data.py

      # The OG cards only depend on a few fields of the data (repo names and star/fork
      # counts, language bytes, contribution total) plus the generator and its inputs.
      # Most days none of that changes, so skip the Chromium install and rendering.
      # The hash is committed so the next run can compare against it.
      - name: Check whether OG images need regenerating
        id: og
        run: |
          HASH=$({
            # Hash what the cards render, not the raw data: the API returns repos in
            # push order (so sort them), and language bytes grow with every commit while
            # the card only shows the top 5 as a rounded percentage and bar width.
            jq -S '{
              repos: {count: (.repositories | length), stars: ([.repositories[].stargazers_count // 0] | add)},
              languages: (
                (.languageBytes | map(.) | add) as $total
                | .languageBytes | to_entries | sort_by(-.value) | .[0:5]
                | map({name: .key, pct: (100 * .value / $total | round), bar: (480 * .value / $total | round)})
              ),
              contributions: .contributions.total
            }' github-data.json
            cat scripts/generate-og.mjs scripts/og-card.mjs \
                modules/utils/html.js fonts/inter-variable.woff2 fonts/jetbrains-mono-500.woff2
          } | sha256sum | cut -d' ' -f1)
          if [ "$HASH" = "$(cat .github/og-inputs.sha256 2>/dev/null)" ]; then
            echo "OG inputs unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "OG inputs changed ($HASH)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$HASH" > .github/og-inputs.sha256
          fi

      # One Node for both the OG renderer and the site generator. pnpm (and the package cache that
      # needs it) is set up only on the days the OG cards are re-rendered.
      - name: Setup pnpm
        if: steps.og.outputs.changed == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: ${{ steps.og.outputs.changed == 'true' && 'pnpm' || '' }}

      - name: Install dependencies
        if: steps.og.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: steps.og.outputs.changed == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate OG images
        if: steps.og.outputs.changed == 'true'
        run: pnpm generate:og

      # The project cards in index.html are pre-rendered from the starred-repo list in
      # github-data.json, so a newly starred repo changes the page. The generator needs
      # only Node (no packages), and most days it leaves index.html untouched.
      - name: Pre-render index.html
        run: node scripts/generate-site.mjs

      - name: Commit GitHub data via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Everything generate-site.mjs writes from this data, matching the generated-files check
          # in quality.yml (tests/unit/generated-files.test.js keeps the two in step)
          git add github-data.json README.md og/ .github/og-inputs.sha256 \
            posts projects status feed.xml sitemap.xml llms.txt index.html 404.html images/projects
          if git diff --cached --quiet; then
            echo "No changes to GitHub data"
            exit 0
          fi

          # main is protected (PR required), so push a branch and merge a PR.
          BRANCH=automation/update-github-data
          git checkout -B "$BRANCH"
          # [skip ci]: PR checks can't run on GITHUB_TOKEN-created PRs (GitHub blocks
          # recursive triggers), so skip them rather than leave 7 failed runs per PR.
          git commit -m "chore: update GitHub data, featured projects, and OG images - $(date -u +"%Y-%m-%d") [skip ci]"
          git push --force origin "$BRANCH"

          PR=$(gh pr list --head "$BRANCH" --base main --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            PR=$(gh pr create --base main --head "$BRANCH" \
              --title "chore: update GitHub data - $(date -u +%Y-%m-%d)" \
              --body "Automated daily refresh of github-data.json, README featured projects, OG images, and the pre-rendered project list in index.html." \
              | grep -oE '[0-9]+$')
          fi
          gh pr merge "$PR" --merge --delete-branch

  # Merges made with GITHUB_TOKEN don't fire push events, so pages.yml never runs
  # for these updates on its own. Dispatch it explicitly (workflow_dispatch is
  # exempt from that rule) so the refreshed data actually goes live.
  deploy-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: update-github-data
    permissions:
      actions: write
    steps:
      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
