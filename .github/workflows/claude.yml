# Answers "@claude" in issues and pull requests. Runs only when a comment, review or issue
# that mentions @claude comes from the repo owner, a member or a collaborator, and uses
# the repo's CLAUDE.md and AGENTS.md like any Claude Code session. Not a visitor feature:
# nothing here runs when someone loads the site.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  claude:
    # Both checks matter: the action also checks write access, and this keeps the job from
    # starting at all for strangers (issues and comments on a public repo are open to anyone).
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event.comment.author_association || github.event.review.author_association ||
      github.event.issue.author_association)
      && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read # lets Claude read CI results on a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # github_token makes the action use this workflow's token, so no GitHub App install is
      # needed. Commits it pushes therefore do not start other workflows; re-run CI by hand.
      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
